services:
  chromium-1:
    image: chromium-xrdp:test
    container_name: chromium-xrdp-1
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "3381:3389"
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      XRDP_USERNAME: ${XRDP_USERNAME:-abc}
      GUI_IDLE_TIMEOUT: ${GUI_IDLE_TIMEOUT:-60}
      CHROMIUM_DEBUG: ${CHROMIUM_DEBUG:-0}
    volumes:
      - ./chromium-xrdp-config-1:/config
      - ./chromium-policies/managed_policies.json:/etc/chromium/policies/managed/managed_policies.json:ro

