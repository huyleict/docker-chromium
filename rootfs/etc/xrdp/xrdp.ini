[Globals]
KillDisconnected=true
DisconnectedTimeLimit=60
crypt_level=low
default_bpp=16
ini_version=1
fork=false
port=3389
security_layer=negotiate
certificate=/etc/xrdp/cert.pem
key_file=/etc/xrdp/key.pem

[Logging]
LogFile=/config/log/xrdp.log
LogLevel=INFO
EnableSyslog=false

[Xvnc]
name=VNC desktop
lib=libvnc.so
username=ask
password=ask
ip=127.0.0.1
port=5900
